name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get PR number
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`
            });

            if (pulls.data.length === 0) {
              core.setFailed('No open PR found for this branch');
              return;
            }

            const pr = pulls.data[0];
            core.setOutput('number', pr.number);
            core.setOutput('url', pr.html_url);
            return pr.number;

      - name: Check if PR is from Dependabot
        id: check-dependabot
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const isDependabot = pr.user.login === 'dependabot[bot]';
            core.setOutput('is-dependabot', isDependabot);
            console.log(`PR #${prNumber} is from ${pr.user.login}`);
            console.log(`Is Dependabot: ${isDependabot}`);
            return isDependabot;

      - name: Approve PR
        if: steps.check-dependabot.outputs.is-dependabot == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: 'APPROVE',
              body: 'Auto-approving Dependabot PR as all CI checks have passed.'
            });
            console.log(`Approved PR #${prNumber}`);

      - name: Enable auto-merge
        if: steps.check-dependabot.outputs.is-dependabot == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};

            // Get PR details to get the node ID
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // Enable auto-merge using GraphQL
            const mutation = `
              mutation EnableAutoMerge($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: $mergeMethod
                }) {
                  pullRequest {
                    autoMergeRequest {
                      enabledAt
                      enabledBy {
                        login
                      }
                    }
                  }
                }
              }
            `;

            try {
              const result = await github.graphql(mutation, {
                pullRequestId: pr.node_id,
                mergeMethod: 'SQUASH'
              });
              console.log(`Enabled auto-merge for PR #${prNumber}`);
              console.log(JSON.stringify(result, null, 2));
            } catch (error) {
              console.error('Failed to enable auto-merge:', error);

              // Fallback: try to merge directly if auto-merge is not available
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  merge_method: 'squash',
                  commit_title: `${pr.title} (#${prNumber})`,
                  commit_message: pr.body || ''
                });
                console.log(`Merged PR #${prNumber} directly`);
              } catch (mergeError) {
                console.error('Failed to merge directly:', mergeError);
                core.setFailed('Could not enable auto-merge or merge directly');
              }
            }
